services:
  - type: web
    name: three-categories-qc-engine
    runtime: docker
    dockerfilePath: ./Dockerfile
    dockerContext: .
    healthCheckPath: /api/health
    plan: starter
    envVars:
      - key: DATABASE_URL
        sync: false
      - key: FRONTEND_ORIGIN
        sync: false
      - key: SURVEYCTO_SERVER
        sync: false
      - key: SURVEYCTO_USERNAME
        sync: false
      - key: SURVEYCTO_PASSWORD
        sync: false
      - key: ADMIN_SEED_USERNAME
        sync: false
      - key: ADMIN_SEED_PASSWORD
        sync: false
      - key: MAIN_SURVEY_FORMDEF_VERSION
        sync: false
      - key: QC_INTEGRATION_API_KEY
        sync: false
      # The hourly SurveyCTO sync runs inside this web service (single uvicorn worker).
      - key: AUTO_SYNC_ENABLED
        value: "true"
      - key: SYNC_INTERVAL_SECONDS
        value: "3600"
      - key: CATEGORY_SYNC_COOLDOWN_SECONDS
        value: "270"
      - key: AUTO_EXPORT_ENABLED
        value: "false"

