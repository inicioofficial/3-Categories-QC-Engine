services:
  - type: web
    name: three-categories-qc-engine
    runtime: docker
    dockerfilePath: ./Dockerfile
    dockerContext: .
    healthCheckPath: /api/health
    plan: starter
    envVars:
      - key: DATABASE_URL
        sync: false
      - key: FRONTEND_ORIGIN
        sync: false
      - key: SURVEYCTO_SERVER
        sync: false
      - key: SURVEYCTO_USERNAME
        sync: false
      - key: SURVEYCTO_PASSWORD
        sync: false
      - key: ADMIN_SEED_USERNAME
        sync: false
      - key: ADMIN_SEED_PASSWORD
        sync: false
      - key: AUTO_SYNC_ENABLED
        value: "false"
      - key: AUTO_EXPORT_ENABLED
        value: "false"

  - type: worker
    name: three-categories-hourly-sync
    runtime: docker
    dockerfilePath: ./Dockerfile
    dockerContext: .
    dockerCommand: python run_etl_worker.py
    plan: starter
    envVars:
      - key: DATABASE_URL
        sync: false
      - key: SURVEYCTO_SERVER
        sync: false
      - key: SURVEYCTO_USERNAME
        sync: false
      - key: SURVEYCTO_PASSWORD
        sync: false
      - key: AUTO_SYNC_ENABLED
        value: "true"
      - key: SYNC_INTERVAL_SECONDS
        value: "3600"
      - key: CATEGORY_SYNC_COOLDOWN_SECONDS
        value: "250"
      - key: AUTO_EXPORT_ENABLED
        value: "false"
